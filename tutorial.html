<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>バトルカレー チュートリアル</title>
    <link rel="icon" type="image/png" sizes="192x192" href="fabi/fabi-01.png">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #b88742; color: #420000; padding: 0; margin: 0; text-align: center; overflow: hidden; }
        #tutWrapper { background: #efdeb1; max-width: 480px; margin: 0 auto; min-height: 100vh; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
        .logo-area { padding: 20px 20px 12px; text-align: center; }
        .logo-area img { width: 192px; max-width: 80%; }

        /* タブ */
        .tab-nav { display: flex; border-bottom: 2px solid #b88742; background: #efdeb1; position: sticky; top: 0; z-index: 200; }
        .tab-btn { flex: 1; padding: 10px 4px 0 4px; border: none; background: none; font-size: 11pt; font-weight: bold; cursor: pointer; color: #420000; display: flex; flex-direction: column; align-items: center; gap: 6px; white-space: nowrap; }
        .tab-btn::after { content: ''; display: block; width: 90%; height: 2px; background: #420000; }
        .tab-btn.active { color: #b88742; }
        .tab-btn.active::after { background: #b88742; }

        /* ページ */
        .page { display: none; text-align: left; padding: 16px 16px 210px; }
        .page.active { display: block; }

        /* 案内人ウィンドウ */
        #tutNarrator {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px;
            background: #2a1200; border-top: 3px solid #b88742;
            z-index: 5000; padding: 12px 14px 14px;
            display: flex; align-items: flex-start; gap: 10px;
            min-height: 110px; cursor: pointer; user-select: none;
        }
        #tutNarrator .mc-img { flex-shrink: 0; width: 72px; height: 72px; object-fit: contain; }
        #tutNarrator .speech-area { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
        #tutNarrator .speech-text { font-size: 14px; color: #fff8ee; line-height: 1.6; min-height: 4em; white-space: pre-wrap; text-align: left; }
        #tutNarrator .speech-next { align-self: flex-end; font-size: 18px; color: #b88742; opacity: 0; }
        #tutNarrator .speech-next.show { opacity: 1; animation: blinkArr 0.8s ease-in-out infinite; }
        @keyframes blinkArr { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

        /* スポットライト */
        .tut-ov { position: fixed; background: rgba(0,0,0,0.65); z-index: 4000; pointer-events: auto; }
        #tutSpotBorder { position: fixed; z-index: 4001; border: 2px solid #b88742; border-radius: 10px; box-shadow: 0 0 0 3px rgba(184,135,66,0.3); pointer-events: none; display: none; }

        /* プレイヤー */
        .player-icon-circle { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #b88742; margin: 0 auto; overflow: hidden; background: #fff8ee; }
        .player-icon-circle img { width: 100%; height: 100%; object-fit: cover; }
        .btn-primary { display: block; width: 80%; margin: 12px auto; padding: 12px; background: #b88742; color: #efdeb1; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; }

        /* 名前入力モーダル */
        #tut-name-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 6000; display: none; align-items: center; justify-content: center; }
        #tut-name-modal.show { display: flex; }
        .tut-modal-box { background: #fff8ee; border-radius: 12px; padding: 24px 20px; width: 88%; max-width: 360px; text-align: center; border: 2px solid #b88742; }
        .tut-modal-box h3 { font-size: 16px; color: #420000; margin: 0 0 16px; }
        .tut-name-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #b88742; border-radius: 6px; text-align: center; color: #420000; background: #fff; margin-bottom: 16px; }
        .btn-gold { background: #b88742; color: #efdeb1; border: none; border-radius: 4px; padding: 12px 24px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; }

        /* 汎用 */
        .section-label { font-size: 12px; color: #9a8060; margin: 8px 0 4px; font-weight: bold; }
        .cook-slot-row { display: flex; gap: 6px; margin-bottom: 8px; }
        .cook-slot { flex: 1; min-height: 80px; border: 1px dashed #b88742; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fffdf0; font-size: 22px; color: #cbb088; cursor: pointer; }
    </style>
</head>
<body>

<!-- スポットライト4枚 -->
<div class="tut-ov" id="ov-top"></div>
<div class="tut-ov" id="ov-bot"></div>
<div class="tut-ov" id="ov-lft"></div>
<div class="tut-ov" id="ov-rgt"></div>
<div id="tutSpotBorder"></div>

<div id="tutWrapper">
    <div class="logo-area"><img src="battlecurry-logo.svg" alt="Battle Curry"></div>
    <nav class="tab-nav">
        <button class="tab-btn active" id="tab-player" onclick="tutTabClick('player')">プレイヤー</button>
        <button class="tab-btn" id="tab-qr"     onclick="tutTabClick('qr')">QR</button>
        <button class="tab-btn" id="tab-fridge" onclick="tutTabClick('fridge')">冷蔵庫</button>
        <button class="tab-btn" id="tab-cook"   onclick="tutTabClick('cook')">調理</button>
        <button class="tab-btn" id="tab-battle" onclick="tutTabClick('battle')">対戦</button>
    </nav>

    <!-- プレイヤー -->
    <div class="page active" id="page-player">
        <div style="text-align:center;padding:20px 0 8px;">
            <div class="player-icon-circle"><img id="tut-icon-img" src="myimageicon/mayimage01.png" alt=""></div>
        </div>
        <div style="font-size:18px;font-weight:bold;color:#420000;text-align:center;margin:8px 0 4px;" id="tut-player-name">――</div>
        <div style="font-size:11px;color:#9a8060;text-align:center;margin-bottom:20px;" id="tut-player-hint">名前を設定しましょう</div>
        <div style="text-align:center;">
            <button class="btn-primary" id="btn-name-input" onclick="tutOpenNameModal()">名前を入力する</button>
        </div>
    </div>

    <!-- QR -->
    <div class="page" id="page-qr">
        <div style="text-align:center;padding:8px 0 12px;">
            <div id="qr-placeholder" style="background:#222;border-radius:8px;aspect-ratio:1;width:100%;max-width:280px;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;">準備中</div>
        </div>
    </div>

    <!-- 冷蔵庫 -->
    <div class="page" id="page-fridge">
        <div style="margin-bottom:16px;">
            <h3 style="font-size:13px;font-weight:bold;color:#420000;border-bottom:1px solid #b88742;padding-bottom:4px;margin-bottom:8px;">所持食材</h3>
            <div id="tut-fridge-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;"></div>
        </div>
    </div>

    <!-- 調理 -->
    <div class="page" id="page-cook">
        <div class="section-label">食材スロット（最大3つ）</div>
        <div class="cook-slot-row">
            <div class="cook-slot" id="tut-slot-0">＋</div>
            <div class="cook-slot" id="tut-slot-1">＋</div>
            <div class="cook-slot" id="tut-slot-2">＋</div>
        </div>
        <button class="btn-primary" id="btn-tut-cook" style="margin-top:16px;">カレーを調理する</button>
    </div>

    <!-- 対戦 -->
    <div class="page" id="page-battle">
        <div id="tut-battle-area" style="text-align:center;color:#9a8060;padding:20px;">準備中...</div>
    </div>
</div>

<!-- 名前入力モーダル -->
<div id="tut-name-modal">
    <div class="tut-modal-box">
        <h3>料理人の名前を入力</h3>
        <input type="text" class="tut-name-input" id="tut-name-field" placeholder="名前（最大12文字）" maxlength="12">
        <button class="btn-gold" onclick="tutConfirmName()">決定</button>
    </div>
</div>

<!-- 案内人 -->
<div id="tutNarrator" onclick="tutNarratorTap()">
    <img class="mc-img" src="tutorial/tutorial-mc.png" alt="">
    <div class="speech-area">
        <div class="speech-text" id="tutSpeechText"></div>
        <div class="speech-next" id="tutSpeechNext">&#9660;</div>
    </div>
</div>

<script>
// ----- LS -----
const LS = { step:'tut_step', done:'tut_done', name:'tut_name', inv:'tut_inv', curry:'tut_curry' };
function lsGet(k){ return localStorage.getItem(LS[k]) || ''; }
function lsSet(k,v){ localStorage.setItem(LS[k], v); }
function lsGetJSON(k){ try{ return JSON.parse(localStorage.getItem(LS[k])||'null'); }catch(e){ return null; } }
function lsSetJSON(k,v){ localStorage.setItem(LS[k], JSON.stringify(v)); }

// ----- タブ -----
var tutAllowedTabs = [];
var tutPendingTab = null;

function tutTabClick(tab) {
    if(tutAllowedTabs.length > 0 && tutAllowedTabs.indexOf(tab) === -1) return;
    tutSwitchTab(tab);
    if(tutPendingTab && tutPendingTab.tab === tab) {
        var cb = tutPendingTab.cb;
        tutPendingTab = null;
        setTimeout(cb, 150);
    }
}
function tutSwitchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
    var btn = document.getElementById('tab-' + tab);
    var pg  = document.getElementById('page-' + tab);
    if(btn) btn.classList.add('active');
    if(pg)  pg.classList.add('active');
    setTimeout(tutRefreshSpotlight, 50);
}
function tutWaitTab(tab, cb) { tutPendingTab = { tab: tab, cb: cb }; }

// ----- スポットライト -----
var _spotTargets = null;

function tutShowSpotlight(targets) {
    _spotTargets = targets;
    tutRefreshSpotlight();
}
function tutRefreshSpotlight() {
    var top = document.getElementById('ov-top');
    var bot = document.getElementById('ov-bot');
    var lft = document.getElementById('ov-lft');
    var rgt = document.getElementById('ov-rgt');
    var bdr = document.getElementById('tutSpotBorder');
    var W = window.innerWidth;
    var H = window.innerHeight;

    function show(el, css) {
        el.removeAttribute('style');
        el.style.cssText = css;
    }
    function hide(el) { el.style.display = 'none'; }

    if(!_spotTargets || _spotTargets.length === 0) {
        show(top, 'top:0;left:0;right:0;height:' + H + 'px;');
        hide(bot); hide(lft); hide(rgt);
        bdr.style.display = 'none';
        return;
    }

    var minX = W, minY = H, maxX = 0, maxY = 0;
    _spotTargets.forEach(function(t) {
        var el = t.el; var pad = t.padding || 8;
        if(!el) return;
        var r = el.getBoundingClientRect();
        minX = Math.min(minX, r.left - pad);
        minY = Math.min(minY, r.top  - pad);
        maxX = Math.max(maxX, r.right  + pad);
        maxY = Math.max(maxY, r.bottom + pad);
    });
    minX = Math.max(0, minX);
    minY = Math.max(0, minY);
    maxX = Math.min(W, maxX);
    maxY = Math.min(H, maxY);

    show(top, 'top:0;left:0;right:0;height:' + minY + 'px;');
    show(bot, 'top:' + maxY + 'px;left:0;right:0;bottom:0;');
    show(lft, 'top:' + minY + 'px;left:0;width:' + minX + 'px;height:' + (maxY-minY) + 'px;');
    show(rgt, 'top:' + minY + 'px;left:' + maxX + 'px;right:0;height:' + (maxY-minY) + 'px;');
    bdr.style.cssText = 'display:block;left:' + minX + 'px;top:' + minY + 'px;width:' + (maxX-minX) + 'px;height:' + (maxY-minY) + 'px;';
}
function tutHideSpotlight() {
    _spotTargets = null;
    ['ov-top','ov-bot','ov-lft','ov-rgt'].forEach(function(id){ document.getElementById(id).style.display='none'; });
    document.getElementById('tutSpotBorder').style.display = 'none';
}
document.getElementById('tutWrapper').addEventListener('scroll', function(){ if(_spotTargets) tutRefreshSpotlight(); }, { passive: true });

// ----- セリフエンジン -----
var _q = [], _typing = false, _full = '', _idx = 0, _timer = null, _done = null;
function eltxt(){ return document.getElementById('tutSpeechText'); }
function elnxt(){ return document.getElementById('tutSpeechNext'); }

function tutSpeak(speeches, onDone) {
    _q = speeches.slice();
    _done = onDone || null;
    _nextLine();
}
function _nextLine() {
    if(_q.length === 0) {
        elnxt().classList.remove('show');
        if(_done){ var cb=_done; _done=null; cb(); }
        return;
    }
    var text = _q.shift();
    _typing = true; _full = text; _idx = 0;
    elnxt().classList.remove('show');
    eltxt().textContent = '';
    clearInterval(_timer);
    _timer = setInterval(function(){
        if(_idx < _full.length){ eltxt().textContent += _full[_idx++]; }
        else { clearInterval(_timer); _typing=false; elnxt().classList.add('show'); }
    }, 40);
}
function tutNarratorTap() {
    if(_typing){ clearInterval(_timer); _typing=false; eltxt().textContent=_full; elnxt().classList.add('show'); }
    else if(elnxt().classList.contains('show')){ elnxt().classList.remove('show'); _nextLine(); }
}

// ----- 名前入力 -----
function tutOpenNameModal() {
    document.getElementById('tut-name-modal').classList.add('show');
    setTimeout(function(){ document.getElementById('tut-name-field').focus(); }, 100);
}
function tutConfirmName() {
    var val = document.getElementById('tut-name-field').value.trim();
    if(!val) return;
    lsSet('name', val);
    lsSet('step', 'named');
    document.getElementById('tut-player-name').textContent = val;
    document.getElementById('tut-name-modal').classList.remove('show');
    tutScenario_Player_After();
}

// ----- シナリオ -----
function tutScenario_Player() {
    var name = lsGet('name');
    if(name) {
        document.getElementById('tut-player-name').textContent = name;
        tutScenario_Player_After();
        return;
    }
    tutAllowedTabs = [];
    tutShowSpotlight([]);
    tutSpeak([
        'ようこそ、バトルカレーへ！\nQRコードで食材を集めて\nカレーを作るゲームです！',
        'まずはあなたの名前を\n入力しましょう。',
    ], function(){
        tutAllowedTabs = [];
        tutShowSpotlight([{ el: document.getElementById('btn-name-input'), padding: 10 }]);
    });
}

function tutScenario_Player_After() {
    document.getElementById('btn-name-input').style.display = 'none';
    document.getElementById('tut-player-hint').textContent = '設定完了！';
    tutAllowedTabs = [];
    tutShowSpotlight([]);
    tutSpeak([
        lsGet('name') + 'さん、よろしく！',
        '次は「QR」タブをタップして\nQRコードで食材を入手しましょう！',
    ], function(){
        lsSet('step', 'qr');
        tutAllowedTabs = ['qr'];
        tutShowSpotlight([{ el: document.getElementById('tab-qr'), padding: 6 }]);
        tutWaitTab('qr', function(){
            tutAllowedTabs = [];
            tutHideSpotlight();
            tutScenario_QR();
        });
    });
}

function tutScenario_QR() {
    tutSpeak(['QRコードをスキャンして\n食材を入手しましょう！'], function(){});
    // TODO: 次ステップで実装
}

// ----- 初期化 -----
window.addEventListener('load', function(){
    if(localStorage.getItem('tut_done') === '1'){ window.location.href = 'game.html'; return; }
    tutShowSpotlight([]);
    var step = lsGet('step');
    var name = lsGet('name');
    if(name) document.getElementById('tut-player-name').textContent = name;
    if(step === 'qr'){
        tutSwitchTab('qr'); tutScenario_QR();
    } else {
        tutSwitchTab('player'); tutScenario_Player();
    }
});
</script>
</body>
</html>
